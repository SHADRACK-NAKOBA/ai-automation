# .github/workflows/ci.yml
# =========================
# Runs the full test suite on every push and pull request.
# Shows a green checkmark on GitHub when all 28 tests pass.

name: CI — Run Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        env:
          ANTHROPIC_API_KEY: placeholder_not_needed_for_unit_tests
          SNOW_BASE_URL: https://placeholder.service-now.com
          DRY_RUN: "true"
          PYTHONPATH: .
        run: |
          pytest tests/unit/ -v --cov=agents --cov=shared --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/